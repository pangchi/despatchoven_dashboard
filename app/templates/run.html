<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protocol 3 Monitor · Run {{ run_id }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body data-run="{{ run_id }}">
<header>
  <div class="brand"><a href="{{ url_for('web.runs_page') }}" class="back">← Runs</a> Run #{{ run_id }}</div>
  <div class="hdr-right">
    <a class="btn small" href="{{ url_for('web.index') }}">Dashboard</a>
    <span class="ver" title="Protocol 3 Monitor version">v{{ app_version }}</span>
    <span class="muted">{{ user }}</span>
    <form method="post" action="{{ url_for('web.logout') }}"><button class="btn small">Sign out</button></form>
  </div>
</header>
<main>
  <section class="runhead">
    <div>
      <h1 id="title">Run #{{ run_id }}</h1>
      <div class="muted" id="subtitle"></div>
    </div>
    <div class="runhead-actions">
      <a class="btn" id="csv" href="/api/v1/runs/{{ run_id }}.csv">Download CSV</a>
    </div>
  </section>
  <section class="flags" id="flags"></section>
  <section class="tiles" id="tiles"></section>
  <section class="card">
    <div class="card-hdr"><h2>Run trend</h2><span class="muted" id="chartnote"></span></div>
    <canvas id="chart" height="320"></canvas>
    <div class="legend"><span class="k pv"></span>PV <span class="k sp"></span>SP <span class="k hl"></span>High-limit PV
      <span class="k pw"></span>Power % <span class="k seg"></span>Segments (S1, S2 …) <span class="k held"></span>Held</div>
  </section>
  <section class="grid2">
    <form class="card" id="editform">
      <h2>Label &amp; notes</h2>
      <label class="stack">Label (lot / batch / job) <input id="label" maxlength="100"></label>
      <label class="stack">Notes <textarea id="notes" rows="5" maxlength="2000" placeholder="Board rev, quantity, operator, observations…"></textarea></label>
      <div class="row-end"><span id="savemsg" class="msg"></span><button class="btn primary" type="submit">Save</button></div>
    </form>
    <div class="card">
      <h2>Events during this run</h2>
      <div class="events" id="events"><span class="muted">Loading…</span></div>
    </div>
  </section>
</main>
<script src="{{ url_for('static', filename='chart.js') }}"></script>
<script src="{{ url_for('static', filename='run.js') }}"></script>
</body>
</html>
